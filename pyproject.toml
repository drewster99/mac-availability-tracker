[project]
name = "mac-availability"
version = "0.1.0"
description = "Track Mac product availability and shipping ETAs across Apple retail stores and regions."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "plotly>=5.20",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
